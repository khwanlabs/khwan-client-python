[project]
name = "fieldcore"
version = "0.1.0"
description = "FieldCore hosted client — the cognition layer (memory + identity + learning) for your own agent. Bring your own model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://fieldcore.ai"
Documentation = "https://docs.fieldcore.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldcore"]
